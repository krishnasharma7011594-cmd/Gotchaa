name: gotchaa
description: "GOTCHAA — Connect globally across language barriers"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  url_launcher: ^6.3.2
  timeago: ^3.7.0

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # API & Networking
  dio: ^5.4.3

  # Local Storage & Persistence
  shared_preferences: ^2.5.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # JSON Serialization
  json_annotation: ^4.9.0

  # Routing & Navigation
  go_router: ^14.2.0

  # DateTime Utilities
  intl: 0.20.2

  # Firebase Integration
  firebase_core: ^3.0.0
  firebase_analytics: ^11.0.0
  firebase_crashlytics: ^4.0.0
  firebase_messaging: ^15.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  firebase_auth: ^5.1.0
  firebase_database: ^11.1.0
  firebase_remote_config: ^5.0.0
  google_sign_in: ^6.2.1

  # Image Handling
  image_picker: ^1.1.2
  cached_network_image: ^3.4.0
  image: ^4.8.0

  # Animation & UI Effects
  flutter_animate: ^4.5.0
  confetti: ^0.7.0
  shimmer: ^3.0.0
  lottie: ^3.1.0
  flutter_staggered_animations: ^1.1.1

  # Video Player
  video_player: ^2.11.0
  
  # Camera & File
  camera: ^0.11.0
  path_provider: ^2.1.3
  device_info_plus: ^10.1.0

  # Utilities
  package_info_plus: ^8.1.0
  permission_handler: ^12.0.1
  flutter_secure_storage: ^10.3.1
  share_plus: ^10.1.0
  connectivity_plus: ^6.1.1
  uuid: ^4.5.3
  flutter_dotenv: ^5.1.0
  flutter_spinkit: ^5.2.2
  google_mlkit_translation: ^0.13.1
  google_mlkit_language_id: ^0.13.1
  firebase_performance: ^0.10.1+10
  spotify: ^0.16.0
  flutter_webrtc: ^1.4.1
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.2
  bip39: ^1.0.6
  qr_flutter: ^4.1.0
  google_mlkit_face_detection: ^0.13.2
  sensors_plus: ^4.0.2
  rxdart: ^0.28.0
  just_audio: ^0.10.5
  audio_session: ^0.1.19
  fl_chart: ^0.68.0
  record: ^6.2.0
  google_mlkit_selfie_segmentation: ^0.10.1
  video_compress: ^3.1.4
  flutter_staggered_grid_view: ^0.7.0
  visibility_detector: ^0.4.0+2
  blurhash_dart: ^1.2.1
  flutter_blurhash: ^0.8.2
  cloud_functions: ^5.6.2
  flutter_native_splash: ^2.3.11
  google_generative_ai: ^0.4.7
  emoji_picker_flutter: ^4.4.0
  giphy_get: ^3.6.1+1
  animate_do: ^5.1.0
  flutter_markdown: ^0.7.2
  firebase_app_check: ^0.3.2+10
  flutter_inappwebview: ^6.1.5
  geolocator: ^14.0.2
  otp: ^3.1.4
  webview_flutter: ^4.13.1
  flutter_local_notifications: ^17.1.2
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  mobile_scanner: ^5.1.1
  local_auth: ^2.2.0
  speech_to_text: ^7.3.0
  flutter_tts: ^4.0.2



dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  riverpod_lint: ^2.3.9
  json_serializable: ^6.8.0
  mockito: ^5.4.4
  mocktail: ^1.0.3
  fake_cloud_firestore: ^3.0.3
  firebase_auth_mocks: ^0.14.1
  network_image_mock: ^2.1.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo/gotchaa_icon_circle.png"
  min_sdk_android: 21
  # Adaptive icon for Android 8+ — uses circle on compatible launchers
  adaptive_icon_background: "#0D0D1A"
  adaptive_icon_foreground: "assets/logo/gotchaa_icon_circle.png"
  web:
    generate: false

flutter_native_splash:
  color: "#0D0D1A"
  image: "assets/logo/gotchaa_splash.png"
  android: true
  ios: true
  web: true
  image_dark: "assets/logo/gotchaa_splash.png"
  color_dark: "#0D0D1A"
  android_12:
    image: "assets/logo/gotchaa_splash.png"
    icon_background_color: "#0D0D1A"
    image_dark: "assets/logo/gotchaa_splash.png"
    icon_background_color_dark: "#0D0D1A"

flutter:
  generate: true
  uses-material-design: true
  assets:
    # NOTE: .env has been REMOVED from assets intentionally.
    # The Gemini API key is now injected at build time via --dart-define:
    #   flutter build apk --dart-define=GEMINI_API_KEY=your_key_here
    # This keeps the key out of the compiled binary bundle.
    - assets/images/
    - assets/animations/
    - assets/logo/
    - assets/l10n/
    - assets/icons/
    - assets/stickers/
    - assets/bgs/
    - assets/filter_previews/
    - PRIVACY_POLICY.md
    - TERMS_OF_SERVICE.md
    - COMMUNITY_GUIDELINES.md
    - COOKIE_POLICY.md
    - ACCEPTABLE_USE_POLICY.md
    - DMCA_POLICY.md
    - LAW_ENFORCEMENT_POLICY.md
    - VULNERABILITY_DISCLOSURE_POLICY.md
  shaders:
    - assets/shaders/beauty_smooth.frag
    - assets/shaders/beauty_color.frag


