name: Flutter CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:  # Allow manual runs from GitHub Actions UI or gh CLI

jobs:
  analyze_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        # Informational only — reports files that need reformatting but does not fail CI.
        # Run `dart format .` locally before committing to keep code clean.
        run: dart format --output=none .

      - name: Run static analysis
        # --no-fatal-infos: info-level hints don't fail CI.
        # --no-fatal-warnings: warnings don't fail CI (only errors do).
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run unit and widget tests
        run: flutter test --reporter=github
