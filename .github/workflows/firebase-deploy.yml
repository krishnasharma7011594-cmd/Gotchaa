name: Firebase Deploy

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main, master ]
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - 'firebase.json'
      - '.github/workflows/firebase-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Disable npm engine-strict check
        run: npm config set engine-strict false

      - name: Install Cloud Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Verify Firebase CLI version
        run: firebase --version

      - name: Authenticate with Google (Service Account)
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > /tmp/sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json" >> $GITHUB_ENV

      - name: Verify Firebase authentication
        run: firebase projects:list --project studio-1284397718-50704

      - name: Deploy Firestore rules & indexes
        run: |
          firebase deploy \
            --non-interactive \
            --project studio-1284397718-50704 \
            --only firestore

      - name: Deploy Storage rules
        run: |
          firebase deploy \
            --non-interactive \
            --project studio-1284397718-50704 \
            --only storage

      - name: Deploy Cloud Functions
        run: |
          firebase deploy \
            --non-interactive \
            --project studio-1284397718-50704 \
            --only functions
