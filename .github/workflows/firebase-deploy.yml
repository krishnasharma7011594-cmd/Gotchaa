name: Firebase Deploy

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main, master ]
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - 'firebase.json'
      - '.github/workflows/firebase-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GOTCHAA }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Disable npm engine-strict check
        run: npm config set engine-strict false

      - name: Install Cloud Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Check syntax of Cloud Functions
        working-directory: functions
        run: node --check index.js

      - name: Authenticate to Google Cloud
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firestore rules & indexes
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT != '' }}
        run: |
          firebase deploy \
            --non-interactive \
            --project studio-1284397718-50704 \
            --only firestore

      - name: Deploy Storage rules
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT != '' }}
        run: |
          firebase deploy \
            --non-interactive \
            --project studio-1284397718-50704 \
            --only storage

      - name: Deploy Cloud Functions
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT != '' }}
        run: |
          firebase deploy \
            --non-interactive \
            --project studio-1284397718-50704 \
            --only functions

      - name: Skip Notice (no credentials configured)
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT == '' }}
        run: echo "ℹ️ Firebase deploy skipped - FIREBASE_SERVICE_ACCOUNT_GOTCHAA secret not configured in this repo."
